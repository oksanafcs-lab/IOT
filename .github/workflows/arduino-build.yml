name: arduino build check

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Compile sketch for Arduino UNO
      uses: arduino/compile-sketches@v1
      with:
        fqbn: arduino:avr:uno
        cli-compile-flags: --output-dir ./build
        sketch-paths: |
          ./sketch
        
    - name: Upload compiled binary as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arduino-uno-binary
        # Вказуємо шлях до зкомпільованого .hex файлу (та інших бінарників)
        path: ./build/
