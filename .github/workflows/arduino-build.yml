name: arduino build check

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Compile sketch for Arduino UNO
      uses: arduino/compile-sketches@v1
      with:
        fqbn: arduino:avr:uno
        sketch-paths: |
          ./sketch
